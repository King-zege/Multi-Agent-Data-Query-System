# 大模型配置
llm:
  provider: "minimax"
  model: "MiniMax-M2.7"
  api_key: "${LLM_API_KEY}"
  temperature: 0.1
  max_tokens: 2048

# 数据库配置
# type: sqlite | mysql | postgresql
database:
  type: "sqlite"              # 数据库类型

  # SQLite 配置
  path: "./data/company.db"

  # MySQL / PostgreSQL 配置（type 非 sqlite 时生效）
  host: "localhost"
  port: 3306                  # MySQL=3306, PostgreSQL=5432
  database: "company"
  username: "root"
  password: ""

# NL2SQL配置
nl2sql:
  num_examples: 5   # Few-shot示例数量

# 记忆配置
memory:
  long_term_db: "./data/long_term_memory.db"  # 长期记忆数据库路径
  short_term_max_tokens: 1000  # 短期记忆最大token数
  compression_threshold: 10  # 超过10条消息开始压缩
  auto_extract_knowledge: true  # 会话中自动提取知识（6轮对话后）

# 联网搜索配置（DeepSearch）
search:
  tavily_api_key: "${TAVILY_API_KEY}"  # Leave empty or set TAVILY_API_KEY env var
  max_results: 5  # 每次搜索返回最大结果数
